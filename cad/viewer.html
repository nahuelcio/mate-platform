<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mate-platform Studio 3D (CAD Inspector)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #e6edf3;
      overflow: hidden;
      height: 100vh;
      display: flex;
    }
    #sidebar {
      width: 360px;
      background: #111827;
      border-right: 1px solid #1f2937;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
      box-shadow: 4px 0 24px rgba(0,0,0,0.6);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1f2937;
    }
    h1 { font-size: 1.15rem; font-weight: 700; color: #f3f4f6; display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      background: #059669;
      color: #ecfdf5;
      padding: 3px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      font-weight: 600;
      margin-top: 4px;
    }
    .piece-list { display: flex; flex-direction: column; gap: 8px; }
    .piece-btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: #d1d5db;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 0.85rem;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .piece-btn:hover { background: #374151; border-color: #60a5fa; color: #fff; }
    .piece-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(37,99,235,0.4);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tool-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .tool-btn:hover { background: #334155; color: #fff; }
    .tool-btn.active { background: #38bdf8; color: #0f172a; font-weight: 700; border-color: #38bdf8; }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #94a3b8;
    }
    .slider-label span:last-child { color: #38bdf8; font-weight: 600; }
    input[type=range] {
      accent-color: #38bdf8;
      width: 100%;
      cursor: pointer;
    }

    .info-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #94a3b8;
      flex-grow: 1;
      overflow-y: auto;
    }
    .info-card strong { color: #38bdf8; }
    .info-card ul { margin-left: 16px; margin-top: 6px; }
    .info-card li { margin-bottom: 4px; }

    #viewer-container {
      flex: 1;
      position: relative;
      height: 100%;
    }
    #canvas3d { width: 100%; height: 100%; display: block; }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      pointer-events: none;
      display: none;
      box-shadow: 0 0 20px rgba(56,189,248,0.25);
    }
    .hud-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #94a3b8;
      backdrop-filter: blur(8px);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>

  <div id="sidebar">
    <div class="header">
      <h1>🧉 mate-platform</h1>
      <span class="badge">Studio CAD</span>
    </div>

    <div class="section-title">Piezas y Ensamble</div>
    <div class="piece-list">
      <button class="piece-btn" onclick="loadPiece(-1)">
        <span>📦 Ensamble Completo</span>
        <small style="opacity: 0.6;">4 Piezas</small>
      </button>
      <button class="piece-btn active" onclick="loadPiece(0)">
        <span>1. Cuna Basculante 45°</span>
        <small style="opacity: 0.6;">Ø78mm + IMU</small>
      </button>
      <button class="piece-btn" onclick="loadPiece(1)">
        <span>2. Chasis Principal</span>
        <small style="opacity: 0.6;">ESP32 + Servo</small>
      </button>
      <button class="piece-btn" onclick="loadPiece(2)">
        <span>3. Carcasa Superior</span>
        <small style="opacity: 0.6;">OLED + US + Mic</small>
      </button>
      <button class="piece-btn" onclick="loadPiece(3)">
        <span>4. Tapa Inferior</span>
        <small style="opacity: 0.6;">Ventilación</small>
      </button>
    </div>

    <div class="section-title">Controles del Modelo</div>
    <div class="controls-grid">
      <button class="tool-btn" id="btn-wireframe" onclick="toggleWireframe()">
        🕸️ Wireframe
      </button>
      <button class="tool-btn" id="btn-autorotate" onclick="toggleAutoRotate()">
        🔄 Auto-Giro
      </button>
    </div>

    <div class="slider-row" id="tilt-control" style="display: none;">
      <div class="slider-label">
        <span>Inclinación de Cebado (Servo)</span>
        <span id="tilt-val">0°</span>
      </div>
      <input type="range" id="tilt-slider" min="0" max="45" value="0" oninput="setTilt(this.value)">
    </div>

    <div class="slider-row" id="explode-control" style="display: none;">
      <div class="slider-label">
        <span>Vista Explosionada (Despiece)</span>
        <span id="explode-val">0 mm</span>
      </div>
      <input type="range" id="explode-slider" min="0" max="60" value="0" oninput="setExplosion(this.value)">
    </div>

    <div class="section-title">Detalles Técnicos</div>
    <div class="info-card" id="info-card">
      <!-- Info dynamically updated -->
    </div>
  </div>

  <div id="viewer-container">
    <div id="loading">Cargando modelo CAD...</div>
    <div id="canvas3d"></div>
    <div class="hud-controls">
      🖱️ <strong>Click Izq:</strong> Rotar | <strong>Rueda:</strong> Zoom | <strong>Click Der:</strong> Mover
    </div>
  </div>

  <script>
    const pieces = [
      {
        name: "01_tilting_cradle_45deg.stl",
        color: 0x10b981, // Esmeralda / Verde mate
        title: "Pieza 1: Cuna Basculante 45°",
        specs: `
          <strong>Función:</strong> Aloja el mate y bascula a 45° para facilitar el cebado.<br>
          <ul>
            <li><strong>Asiento:</strong> Cono de centrado para mates de Ø 60 a 78 mm.</li>
            <li><strong>Anti-vibración:</strong> 4 nervios internos para agarre firme.</li>
            <li><strong>Pivotes:</strong> Ejes reforzados Ø 7.0 mm con horquilla de empuje.</li>
            <li><strong>Sensores:</strong> Bolsillo inferior a medida para acelerómetro GY-521 (MPU6050) y activador de microswitch de presencia.</li>
          </ul>
        `
      },
      {
        name: "02_main_enclosure_base.stl",
        color: 0x3b82f6, // Azul chasis
        title: "Pieza 2: Chasis Principal",
        specs: `
          <strong>Función:</strong> Estructura portante para electrónica y actuadores.<br>
          <ul>
            <li><strong>ESP32 DevKit V1:</strong> Rieles guía con tope trasero y ranura para USB.</li>
            <li><strong>Microservo SG90:</strong> Alojamiento con abrazaderas rígidas a prueba de torque.</li>
            <li><strong>Buzzer 12mm:</strong> Vaso resonador para alarma acústica de mate colgado.</li>
            <li><strong>Fijación:</strong> 4 torretas en esquinas para insertos roscados M3.</li>
          </ul>
        `
      },
      {
        name: "03_upper_sensor_fascia.stl",
        color: 0xf59e0b, // Ámbar frontal
        title: "Pieza 3: Carcasa Superior y Sensores",
        specs: `
          <strong>Función:</strong> Panel frontal interactivo y bancadas de giro.<br>
          <ul>
            <li><strong>Pantalla OLED 0.96":</strong> Bisel angulado a 30° ergonómico.</li>
            <li><strong>Ultrasonido HC-SR04:</strong> Dos bocas cilíndricas a 26 mm entre centros.</li>
            <li><strong>Micrófono GY-MAX9814:</strong> Cono acústico aislado mecánicamente del servo.</li>
            <li><strong>Chumaceras:</strong> Bancadas reforzadas para los pernos de giro de la cuna.</li>
          </ul>
        `
      },
      {
        name: "04_bottom_service_lid.stl",
        color: 0x8b5cf6, // Púrpura tapa
        title: "Pieza 4: Tapa Inferior de Servicio",
        specs: `
          <strong>Función:</strong> Cierre de base, disipación y estabilidad en mesa.<br>
          <ul>
            <li><strong>Ventilación:</strong> 12 ranuras persiana para evacuar calor del ESP32.</li>
            <li><strong>Patas de goma:</strong> 4 rebajes cilíndricos para pads antideslizantes Ø 12 mm.</li>
            <li><strong>Mantenimiento:</strong> Muesca de apertura rápida para inspección de cableado.</li>
          </ul>
        `
      }
    ];

    const container = document.getElementById('canvas3d');
    const loading = document.getElementById('loading');
    const infoCard = document.getElementById('info-card');
    const tiltControl = document.getElementById('tilt-control');
    const explodeControl = document.getElementById('explode-control');
    const tiltSlider = document.getElementById('tilt-slider');
    const tiltVal = document.getElementById('tilt-val');
    const explodeSlider = document.getElementById('explode-slider');
    const explodeVal = document.getElementById('explode-val');
    const btns = document.querySelectorAll('.piece-btn');

    let isWireframe = false;
    let currentMode = 0; // -1: assembly, 0-3: single
    const meshes = [];

    // Scene & Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090d16);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 1200);
    camera.position.set(140, 160, 190);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lights
    const amb = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(amb);

    const dir1 = new THREE.DirectionalLight(0xffffff, 0.9);
    dir1.position.set(180, 220, 150);
    scene.add(dir1);

    const dir2 = new THREE.DirectionalLight(0x38bdf8, 0.5);
    dir2.position.set(-180, -120, -100);
    scene.add(dir2);

    // Floor grid
    const grid = new THREE.GridHelper(300, 30, 0x1e293b, 0x0f172a);
    grid.position.y = -2;
    scene.add(grid);

    const loader = new THREE.STLLoader();

    function clearScene() {
      meshes.forEach(m => scene.remove(m));
      meshes.length = 0;
    }

    function toggleWireframe() {
      isWireframe = !isWireframe;
      document.getElementById('btn-wireframe').classList.toggle('active', isWireframe);
      meshes.forEach(m => {
        if (m.material) m.material.wireframe = isWireframe;
      });
    }

    function toggleAutoRotate() {
      controls.autoRotate = !controls.autoRotate;
      document.getElementById('btn-autorotate').classList.toggle('active', controls.autoRotate);
    }

    function setTilt(angle) {
      tiltVal.innerText = `${angle}°`;
      if (meshes.length > 0 && currentMode === 0) {
        // Rotate cradle around pivot X axis
        meshes[0].rotation.x = -Math.PI / 2 + (angle * Math.PI / 180);
      }
    }

    function setExplosion(dist) {
      explodeVal.innerText = `${dist} mm`;
      if (currentMode === -1 && meshes.length === 4) {
        // meshes[0]: cradle (+Y)
        // meshes[1]: base (0)
        // meshes[2]: fascia (+Y intermediate)
        // meshes[3]: lid (-Y)
        const d = parseFloat(dist);
        meshes[0].position.y = 38 + d * 1.5;
        meshes[2].position.y = 20 + d * 0.8;
        meshes[3].position.y = -4 - d * 0.6;
      }
    }

    function loadPiece(index) {
      currentMode = index;
      btns.forEach((b, i) => b.classList.toggle('active', i === (index === -1 ? 0 : index + 1)));
      clearScene();
      loading.style.display = 'block';

      if (index === -1) {
        // Assembly mode
        tiltControl.style.display = 'none';
        explodeControl.style.display = 'flex';
        explodeSlider.value = 0;
        explodeVal.innerText = "0 mm";

        infoCard.innerHTML = `
          <strong>📦 Ensamble Estructural Completo</strong><br>
          Visualización de encaje de las 4 piezas impresas:<br>
          <ul>
            <li><strong>Arriba:</strong> Cuna basculante y carcasa frontal de sensores.</li>
            <li><strong>Centro:</strong> Chasis de control para ESP32, servo y buzzer.</li>
            <li><strong>Abajo:</strong> Tapa de servicio con ventilación pasiva.</li>
          </ul>
          <em>Usa la barra "Vista Explosionada" para separar las piezas y ver el interior.</em>
        `;

        let count = 0;
        pieces.forEach((p, idx) => {
          loader.load(`models/${p.name}`, (geom) => {
            const mat = new THREE.MeshStandardMaterial({
              color: p.color,
              roughness: 0.35,
              metalness: 0.2,
              wireframe: isWireframe
            });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.rotation.x = -Math.PI / 2;
            if (idx === 0) mesh.position.y = 38;
            if (idx === 2) mesh.position.y = 20;
            if (idx === 3) mesh.position.y = -4;
            scene.add(mesh);
            meshes[idx] = mesh;
            count++;
            if (count === 4) loading.style.display = 'none';
          });
        });
        return;
      }

      // Single piece mode
      explodeControl.style.display = 'none';
      tiltControl.style.display = (index === 0) ? 'flex' : 'none';
      if (index === 0) {
        tiltSlider.value = 0;
        tiltVal.innerText = "0°";
      }

      const p = pieces[index];
      infoCard.innerHTML = `<strong>${p.title}</strong><br>${p.specs}`;

      loader.load(`models/${p.name}`, (geom) => {
        geom.center();
        const mat = new THREE.MeshStandardMaterial({
          color: p.color,
          roughness: 0.3,
          metalness: 0.25,
          wireframe: isWireframe
        });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.rotation.x = -Math.PI / 2;
        scene.add(mesh);
        meshes.push(mesh);
        loading.style.display = 'none';
      });
    }

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Start with cradle
    loadPiece(0);
  </script>
</body>
</html>
